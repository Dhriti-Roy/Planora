  const message=nq?'Try a different search phrase.':noNotes?'Create your first note with the New note button above.':nf.sub?'Create a note to start collecting ideas in this topic.':nf.s?'Create a note for this subject, or choose another folder.':'Choose another folder or create a note.';
  const search=nq?`<input id="nq" class="nl-search" type="search" placeholder="Search notes…" aria-label="Search notes" value="${esc(nq)}">`:'';
  return `${heading}<div class="nw">${tree}<section class="notes-zero" aria-live="polite"><div class="notes-zero-inner">${search}<div class="notes-zero-icon" aria-hidden="true">✎</div><h2>${title}</h2><p>${message}</p></div></section></div>`;
 }
 const titleForList=nf.sub|| (nf.s?subName(nf.s):'All notes');
 const lst=`<section class="nl" aria-label="Notes list"><div class="nl-top"><h2>${esc(titleForList)}</h2><span class="nl-count">${L.length} ${L.length===1?'note':'notes'}</span></div><input id="nq" class="nl-search" type="search" placeholder="Search notes…" aria-label="Search notes" value="${esc(nq)}"><div class="nl-items">${L.map(n=>`<button class="ni ${n.id===openN?'on':''}" data-nid="${esc(n.id)}" aria-current="${n.id===openN?'true':'false'}"><b class="nt">${esc(n.title||'Untitled note')}</b><span>${esc(n.date?fd(n.date):'Undated')}${n.s?' · '+esc(subName(n.s)):''}${n.sub?' › '+esc(n.sub):''}</span><small>${esc(String(n.body||'').trim().slice(0,130)||'No text yet — open to start writing.')}</small></button>`).join('')}</div></section>`;
 const subs=(N.subjects.find(s=>s.id===cur.s)||{subs:[]}).subs||[];
 const ed=`<section class="ed" aria-label="Note editor"><div class="ed-head"><button class="ghost back" data-act="nback">‹ Notes list</button><span class="ed-label">Writing space</span>

 
<div class="save-actions">
  <span id="noteSaveState" class="save-state"
    role="status" aria-live="polite">Ready</span>

  <button
    type="button"
    id="noteSaveButton"
    class="pri"
    data-act="nsave">
    Save note
  </button>
</div>


 
 </div><input id="nt" class="ntitle" maxlength="180" value="${esc(cur.title||'')}" placeholder="Untitled note" aria-label="Note title"><div class="row"><select id="nsj" aria-label="Subject"><option value="">No subject</option>${N.subjects.map(s=>`<option value="${esc(s.id)}" ${cur.s===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><select id="nsb" aria-label="Topic" ${!cur.s?'disabled':''}><option value="">No topic</option>${subs.map(x=>`<option value="${esc(x)}" ${cur.sub===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><textarea id="nb" placeholder="Start writing… your changes save automatically." aria-label="Note content">${esc(cur.body||'')}</textarea><div class="ed-footer"><span class="note">${cur.date?fd(cur.date):'Undated'} · <span id="noteUpdated">Saved automatically</span></span><button class="ghost" data-act="ndel">${armK==='n'?'Confirm delete':'Delete note'}</button></div></section>`;
 return `${heading}${mobile}<div class="nw mobile-${notesStage}">${tree}${lst}${ed}</div>`;
}
/* STICKIES */
const SC=['#FFF3A8','#FFD1DC','#BFE3FF','#C9F0CF','#E2D4FF'],stRoots=new Set();
const saveS=()=>{try{localStorage.setItem('dm-stickies',JSON.stringify(ST))}catch(e){}};
function fillSt(r){r.innerHTML=`<div class="stbar"><span>New sticky</span>${SC.map(c=>`<button class="sw" data-sadd="${c}" style="background:${c}" aria-label="Add a sticky note"></button>`).join('')}</div><div class="stg ${ST.length===1?'one':''}">${ST.length?ST.map(s=>`<div class="stk" style="background:${s.c}"><button class="x" data-sx="${s.id}" aria-label="Remove this sticky note">×</button><textarea data-st="${s.id}" aria-label="Sticky note" placeholder="Write something to remember…">${esc(s.t)}</textarea></div>`).join(''):'<div class="empty" style="grid-column:1/-1">No sticky notes yet. Pick a colour above to add one.</div>'}</div>`}
function repaintSt(){stRoots.forEach(r=>{try{if(r.isConnected)fillSt(r);else stRoots.delete(r)}catch(e){stRoots.delete(r)}})}
function mountSt(r){stRoots.add(r);fillSt(r);r.addEventListener('click',e=>{const a=e.target.closest('[data-sadd]'),x=e.target.closest('[data-sx]');
 if(a){ST.unshift({id:uid(),t:'',c:a.dataset.sadd});saveS();repaintSt();const t=r.querySelector('textarea');t&&t.focus()}else if(x){ST=ST.filter(s=>s.id!==x.dataset.sx);saveS();repaintSt()}});
 r.addEventListener('input',e=>{const s=ST.find(z=>z.id===e.target.dataset.st);if(s){s.t=e.target.value;saveS()}})}
function stkV(){return `<div class="hd"><div><h1>Sticky notes</h1><p class="sub">Short reminders that stay in front of you while you work.</p></div><button class="pri" data-act="pop">Pop out on my screen</button></div><p class="note" style="margin:-.4rem 0 1rem">Pop out keeps your stickies on top of other apps. It works in Chrome and Edge on a laptop or desktop. Use the × on a sticky to remove it.</p><div id="stroot"></div>`}
async function popOut(){if(!('documentPictureInPicture' in window)){toast('Pop out needs Chrome or Edge on a laptop or desktop.');return}
 if(pip&&!pip.closed){pip.focus();return}
 try{pip=await documentPictureInPicture.requestWindow({width:340,height:480});const d=pip.document;
  [...document.styleSheets].forEach(ss=>{try{const s=d.createElement('style');s.textContent=[...ss.cssRules].map(r=>r.cssText).join('');d.head.appendChild(s)}catch(e){if(ss.href){const l=d.createElement('link');l.rel='stylesheet';l.href=ss.href;d.head.appendChild(l)}}});
  d.documentElement.dataset.theme=tm;d.body.className='pip';const r=d.createElement('div');r.className='pr';d.body.appendChild(r);mountSt(r);pip.addEventListener('pagehide',()=>{stRoots.delete(r);pip=null})}
 catch(e){toast('Pop out is blocked here. Open this page in its own browser tab and try again.')}}
/* SETTINGS */
function setV(){const np='Notification' in window?Notification.permission:'unsupported';
 return `<h1>Settings</h1><p class="sub">${APP} is free. Your data stays in this browser.</p>
 <section style="margin-bottom:1.4rem"><h2>Theme</h2><div class="seg" role="group" aria-label="Theme">${themeBtns()}</div></section>
 <section style="margin-bottom:1.4rem"><h2>Reminders</h2><p class="note">Work while ${APP} is open. Browser permission: ${np}.</p><button class="ghost" data-act="perm">Allow notifications</button></section>
 <section><h2>Backup</h2><div class="tools"><button class="ghost" data-act="csv">Show tasks as CSV</button><button class="ghost" data-act="json">Show everything as JSON</button><button class="ghost" data-act="wipe">${armK==='w'?'Confirm: delete all data':'Delete all data'}</button></div><textarea id="ex" rows="6" style="width:100%;display:none" readonly aria-label="Exported data"></textarea></section>`}
const V={cal,tasks:tasksV,notes:notesV,stk:stkV,set:setV};
function render(){$('#m').innerHTML=V[view]();document.querySelectorAll('nav .nv').forEach(b=>b.dataset.v===view?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));if(view==='stk')mountSt($('#stroot'))}
/* dialog */
function openDlg(id,day){editId=id;const t=T.find(x=>x.id===id)||{};$('#dt').textContent=id?'Edit task':'New task';
 $('#f-t').value=t.title||'';$('#f-d').value=t.desc||'';$('#f-dd').value=t.due||day||'';$('#f-dt').value=t.time||'';$('#f-p').value=t.pri||'med';$('#f-c').value=t.cat||'';$('#f-rd').value=t.rd||'';$('#f-rt').value=t.rt||'09:00';$('#f-err').textContent='';
 const d=$('#f-del');d.hidden=!id;d.textContent='Delete task';delete d.dataset.arm;$('#dlg').showModal();$('#f-t').focus()}
$('#f-x').onclick=()=>$('#dlg').close();
$('#f-del').onclick=e=>{const b=e.target;if(b.dataset.arm){T=T.filter(x=>x.id!==editId);save();$('#dlg').close();render();toast('Task deleted')}else{b.dataset.arm=1;b.textContent='Click again to delete'}};
$('#f-s').onclick=()=>{const ti=$('#f-t').value.trim();if(!ti){$('#f-err').textContent='Enter a title for the task.';return}
 const o={title:ti,desc:$('#f-d').value,due:$('#f-dd').value||null,time:$('#f-dt').value||null,pri:$('#f-p').value,cat:$('#f-c').value.trim(),rd:$('#f-rd').value||null,rt:$('#f-rt').value,rn:false};
 if(editId)Object.assign(T.find(x=>x.id===editId),o);else T.push({id:uid(),done:false,created:Date.now(),...o});
 if(o.due)selDay=o.due;save();$('#dlg').close();render();toast('Task saved')};
/* actions */
function addQ(){const i=$('#qa');if(!i||!i.value.trim())return;const p=parseQ(i.value.trim()),d=p.due||selDay;T.push({id:uid(),title:p.title,due:d,pri:p.pri,done:false,created:Date.now(),cat:'',time:null,desc:''});save();render();toast('Added for '+fd(d));const n=$('#qa');n&&n.focus()}
function addSj(){const i=$('#ns'),v=i&&i.value.trim();if(!v)return;if(N.subjects.some(s=>s.name.toLocaleLowerCase()===v.toLocaleLowerCase())){toast('That subject already exists.');i.focus();return}const s={id:uid(),name:v,subs:[]};N.subjects.push(s);nf={s:s.id,sub:''};notesStage='tree';save();render();toast('Subject added')}
function addSub(){const i=$('#nsub'),v=i&&i.value.trim(),s=N.subjects.find(x=>x.id===nf.s);if(!v||!s)return;s.subs=s.subs||[];if(s.subs.some(x=>x.toLocaleLowerCase()===v.toLocaleLowerCase())){toast('That topic already exists.');i.focus();return}s.subs.push(v);save();render();const next=$('#nsub');next&&next.focus();toast('Topic added')}
const newNote=o=>{nq='';const n={id:uid(),title:'',body:'',s:nf.s,sub:nf.sub,date:TD(),upd:Date.now(),...o};N.notes.push(n);save();openN=n.id;notesStage='editor';render();const title=$('#nt');if(title)title.focus();return n};
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const i=e.target.id;if(i==='qa')addQ();else if(i==='ns')addSj();else if(i==='nsub')addSub()});
const keep=(id,fn)=>{const p=$('#'+id).selectionStart;fn();render();const n=$('#'+id);n.focus();n.setSelectionRange(p,p)};
document.addEventListener('input', e => {
  const i = e.target.id;
  const c = N.notes.find(n => n.id === openN);

  if (i === 'fq') {
    keep('fq', () => f.q = e.target.value);
  } 
  else if (i === 'nq') {
    keep('nq', () => nq = e.target.value);
  } 
  else if (c && (i === 'nt' || i === 'nb')) {
    // Update the note data
    c[i === 'nt' ? 'title' : 'body'] = e.target.value;
    c.upd = Date.now();

    const state = document.getElementById('noteSaveState');
    const updated = document.getElementById('noteUpdated');
    const button = document.getElementById('noteSaveButton');

    // Show the saving state
    if (state) state.textContent = 'Saving…';
    if (updated) updated.textContent = 'Saving…';

    if (button) {
      button.textContent = 'Saving…';
      button.classList.remove('is-saved');
    }

    // Save to localStorage
    save();

    // Show confirmation
    if (state) state.textContent = 'Saved successfully';
    if (updated) updated.textContent = 'Saved just now';

    if (button) {
      button.textContent = 'Saved ✓';
      button.classList.add('is-saved');
    }

    // Update the title in the notes list
    if (i === 'nt') {
      const el = document.querySelector(
        `[data-nid="${c.id}"] .nt`
      );

      if (el) {
        el.textContent = e.target.value || 'Untitled note';
      }
    }
  }
});
  
document.addEventListener('change',e=>{const i=e.target.id,c=N.notes.find(n=>n.id===openN);
 if(i==='fc'){f.cat=e.target.value;render()}else if(i==='fp'){f.pri=e.target.value;render()}else if(c&&i==='nsj'){c.s=e.target.value;c.sub='';save();render()}else if(c&&i==='nsb'){c.sub=e.target.value;save();render()}});
document.addEventListener('click',e=>{const t0=e.target;
 /* Open task details only when the calendar task title itself is clicked. */
 const op=t0 instanceof Element ? t0.closest('button.cn[data-open]') : null;
 if(op){e.preventDefault();e.stopPropagation();showTaskDetails(op.dataset.open);return;}
 if(t0.closest('.chip')){if(t0.matches('input'))setDone(t0.dataset.id,t0.checked);return}
 const th=t0.closest('[data-th]');if(th){setTheme(th.dataset.th);return}
 const nv=t0.closest('[data-v]');if(nv){armK=null;view=nv.dataset.v;render();window.scrollTo(0,0);return}
 const st=t0.closest('[data-set]');if(st){f[st.dataset.set]=st.dataset.val;render();return}
 const cfb=t0.closest('[data-cf]');if(cfb){cf[cfb.dataset.cf]=cfb.dataset.val;render();return}
 const nstage=t0.closest('[data-nstage]');if(nstage){notesStage=nstage.dataset.nstage;render();return}
 const nfb=t0.closest('[data-nf]');if(nfb){const k=nfb.dataset.nf;nf={s:k==='s'||k==='sub'?nfb.dataset.sid:'',sub:k==='sub'?nfb.dataset.sub:''};openN=null;notesStage='list';nq='';render();return}
 const ni=t0.closest('[data-nid]');if(ni){openN=ni.dataset.nid;notesStage='editor';render();return}
 const b=t0.closest('[data-act]');
 if(!b){const dy=t0.closest('[data-day]');if(dy){selDay=dy.dataset.day;render()}return}
 const a=b.dataset.act,c=b.closest('.card'),id=c&&c.dataset.id,t=T.find(x=>x.id===id);

if (a === 'nsave') {
  const note = N.notes.find(n => n.id === openN);

  if (!note) {
    toast('No note selected');
    return;
  }

  note.upd = Date.now();
  save();

  const button = document.getElementById('noteSaveButton');
  const state = document.getElementById('noteSaveState');
  const updated = document.getElementById('noteUpdated');

  if (button) {
    button.textContent = 'Saved ✓';
    button.classList.add('is-saved');
  }

  if (state) state.textContent = 'Saved successfully';
  if (updated) updated.textContent = 'Saved just now';

  toast('Note saved successfully');
  return;
}

                                      
 if(!/^del|^ndel|^wipe/.test(a))armK=null;
 if(a==='tog')setDone(id,b.checked);else if(a==='tog2')setDone(id,!t.done);else if(a==='exp'){openT.has(id)?openT.delete(id):openT.add(id);render()}
 else if(a==='edit')openDlg(id);else if(a==='tod'){t.due=TD();save();render();toast('Moved to today')}
 else if(a==='del'){if(arm('t'+id)){T=T.filter(x=>x.id!==id);save();render();toast('Task deleted')}}
 else if(a==='new')openDlg();else if(a==='newday')openDlg(null,selDay);else if(a==='qa')addQ();
 else if(a==='prev'||a==='next'){const s=a==='next'?1:-1;anchor=mode==='year'?new Date(anchor.getFullYear()+s,0,1):mode==='month'?new Date(anchor.getFullYear(),anchor.getMonth()+s,1):new Date(anchor.getFullYear(),anchor.getMonth(),anchor.getDate()+7*s);render()}
 else if(a==='today'){anchor=new Date();selDay=TD();render()}else if(a==='mode'){mode=b.dataset.val;anchor=pd(selDay);render()}
 else if(a==='gomonth'){mode='month';anchor=new Date(anchor.getFullYear(),+b.dataset.val,1);render()}
 else if(a==='pop')popOut();
 else if(a==='nnew')newNote();
 else if(a==='nback'){notesStage='list';render()}else if(a==='ndel'){if(arm('n')){N.notes=N.notes.filter(n=>n.id!==openN);openN=null;armK=null;save();notesStage='list';render();toast('Note deleted')}}
 else if(a==='addsj')addSj();else if(a==='addsub')addSub();
 else if(a==='delsj'){if(arm('sj')){N.notes.forEach(n=>{if(n.s===nf.s){n.s='';n.sub=''}});N.subjects=N.subjects.filter(s=>s.id!==nf.s);nf={s:'',sub:''};save();render()}}
 else if(a==='perm'){if('Notification' in window)Notification.requestPermission().then(render);else toast('This browser does not support notifications.')}
 else if(a==='csv'||a==='json'){const x=$('#ex');x.style.display='block';x.value=a==='json'?JSON.stringify({tasks:T,notes:N,stickies:ST},null,2):['title,due,time,priority,category,done'].concat(T.map(t=>[t.title,t.due||'',t.time||'',t.pri,t.cat||'',t.done].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))).join('\n');x.select()}
 else if(a==='wipe'){if(arm('w')){T=[];ST=[];N={subjects:[],notes:[]};openN=null;save();render()}}});
function chk(){const n=new Date(),d=iso(n),hm=pad(n.getHours())+':'+pad(n.getMinutes());let ch=false;
 T.forEach(t=>{if(!t.done&&t.rd&&!t.rn&&(t.rd<d||(t.rd===d&&(t.rt||'09:00')<=hm))){t.rn=true;ch=true;toast('Reminder: '+t.title);try{if('Notification' in window&&Notification.permission==='granted')new Notification(APP,{body:t.title})}catch(e){}}});if(ch)save()}
setInterval(chk,30000);chk();render();
</script></body></html>
